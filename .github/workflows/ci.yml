name: CI

on:
  pull_request:
    paths:
      - 'site/**'
      - 'catalog/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'catalog/**'
      - '.github/workflows/ci.yml'

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One install, then each script in order: Biome, types, unit tests, skill content and index,
  # eval structure.
  ci:
    name: lint, typecheck, test, validate
    uses: JosephSearle/workflow-catalog/.github/workflows/node-ci.yml@52dc33b701540a49cfc36f03ac93a779631441af # v1.0.0
    permissions:
      contents: read
    with:
      working-directory: site
      node-version: "20"
      scripts: lint:ci typecheck test build:index validate:evals

  e2e:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: site/playwright-report/
          retention-days: 7
